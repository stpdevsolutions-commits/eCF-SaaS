services:
  ecf-postgres:
    image: postgres:15-alpine
    container_name: ecf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - ecf-postgres-data:/var/lib/postgresql/data
    networks:
      - ecf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ecf-redis:
    image: redis:7-alpine
    container_name: ecf-redis
    restart: unless-stopped
    networks:
      - ecf-network

  ecf-api:
    build: .
    container_name: ecf-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      ecf-postgres:
        condition: service_healthy
    networks:
      - ecf-network
      - stp-network

  ecf-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://ecf-api.stpsoluciones.com
    container_name: ecf-frontend
    restart: unless-stopped
    depends_on:
      - ecf-api
    networks:
      - stp-network

networks:
  ecf-network:
  stp-network:
    external: true
    name: stp_stp-network

volumes:
  ecf-postgres-data:
